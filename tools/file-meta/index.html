<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>文件元信息</title>
<script src="../../assets/theme-init.js"></script>
<script type="module" src="../../assets/favicons.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }
  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  /* Drop zone fills the available area when no file is loaded. */
  #drop-hint {
    flex: 1 1 auto;
    margin: 40px;
    align-self: stretch;
    min-height: 0;
  }

  #meta-list {
    display: none;
    flex-direction: column;
    gap: 20px;
    margin: 40px;
  }
  #meta-list.active { display: flex; }

  .meta-card {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas:
      "head    preview"
      "body    preview";
    column-gap: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--ft-radius-lg);
    padding: 20px 24px;
    box-shadow: var(--shadow);
  }

  .meta-card-head {
    grid-area: head;
    display: flex;
    align-items: center;
    gap: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .meta-card-head .index {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 10px;
    flex: 0 0 auto;
  }
  .meta-card-head .name {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    word-break: break-all;
    flex: 1;
  }
  .meta-card.has-error .meta-card-head .name {
    color: var(--danger, #dc2626);
  }
  .meta-card-body {
    grid-area: body;
    padding-top: 16px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    min-width: 0;
  }
  .meta-card .error-text {
    font-size: 14px;
    color: var(--danger, #dc2626);
  }

  .preview {
    grid-area: preview;
    align-self: start;
    width: 280px;
    max-width: 35vw;
    display: flex;
    justify-content: center;
    align-items: center;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--ft-radius-md);
    padding: 8px;
    overflow: hidden;
  }
  .preview img {
    max-width: 100%;
    max-height: 240px;
    object-fit: contain;
    display: block;
    cursor: zoom-in;
    border-radius: 4px;
    /* 棋盘格背景，便于看出透明区域 */
    background-color: #fff;
    background-image:
      linear-gradient(45deg, #e5e7eb 25%, transparent 25%),
      linear-gradient(-45deg, #e5e7eb 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #e5e7eb 75%),
      linear-gradient(-45deg, transparent 75%, #e5e7eb 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0;
  }
  .preview video {
    max-width: 100%;
    max-height: 240px;
    display: block;
    border-radius: 4px;
    background: #000;
  }

  /* 窄屏退化为纵向布局，避免预览挤压元信息 */
  @media (max-width: 720px) {
    .meta-card {
      grid-template-columns: minmax(0, 1fr);
      grid-template-areas:
        "head"
        "preview"
        "body";
      row-gap: 16px;
    }
    .preview {
      width: 100%;
      max-width: 100%;
      justify-self: stretch;
    }
  }

  /* Lightbox */
  #lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.82);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 32px;
    z-index: 100;
    cursor: zoom-out;
  }
  #lightbox.active { display: flex; }
  #lightbox img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5);
    background-color: #fff;
    background-image:
      linear-gradient(45deg, #e5e7eb 25%, transparent 25%),
      linear-gradient(-45deg, #e5e7eb 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #e5e7eb 75%),
      linear-gradient(-45deg, transparent 75%, #e5e7eb 75%);
    background-size: 24px 24px;
    background-position: 0 0, 0 12px, 12px -12px, -12px 0;
  }
  #lightbox-caption {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 16px;
    text-align: center;
    color: #f1f5f9;
    font-size: 13px;
    pointer-events: none;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
  }

  .meta-section {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .meta-section h2 {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    margin: 0;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .meta-grid {
    display: grid;
    grid-template-columns: minmax(140px, max-content) 1fr;
    gap: 6px 16px;
    font-size: 14px;
  }

  .meta-grid dt {
    color: var(--text-muted);
    font-weight: 500;
    word-break: break-word;
  }

  .meta-grid dd {
    margin: 0;
    color: var(--text);
    word-break: break-word;
    white-space: pre-wrap;
  }

  .chunks-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .chunks-table th,
  .chunks-table td {
    padding: 6px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  .chunks-table th {
    font-weight: 600;
    color: var(--text-muted);
    background: var(--surface-2);
  }
  .chunks-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .chunks-table tr:last-child td { border-bottom: 0; }

  .mono {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
</style>
<link rel="stylesheet" href="../../assets/styles/tokens.css">
<link rel="stylesheet" href="../../assets/styles/tool-page.css">
<link rel="stylesheet" href="../../assets/components/tool-header/index.css">
<link rel="stylesheet" href="../../assets/components/file-input/index.css">
</head>
<body class="tool-page">
<div id="header-controls" hidden>
  <button id="add-btn" type="button">添加文件</button>
  <input type="file" id="file-input" class="visually-hidden-file" accept="image/png,.png,image/jpeg,.jpg,.jpeg,video/mp4,.mp4" multiple aria-label="选择文件">
</div>

<main>
  <div id="drop-hint" class="file-drop-zone" role="button" tabindex="0" aria-labelledby="meta-drop-title">
    <div class="file-drop-icon icon-file-drop" aria-hidden="true"></div>
    <div>
      <div id="meta-drop-title" class="file-drop-title"></div>
    </div>
    <div id="meta-drop-status" class="file-drop-status" hidden></div>
  </div>

  <section id="meta-list" aria-live="polite"></section>
</main>

<div id="lightbox" role="dialog" aria-modal="true" aria-label="图片预览">
  <img id="lightbox-img" alt="">
  <div id="lightbox-caption"></div>
</div>

<script type="module">
import { mount as mountToolHeader } from '../../assets/components/tool-header/index.js';
import { bind as bindFileInputDropZone } from '../../assets/components/file-input/index.js';
import { el } from './shared.js';
import { inspectFile, isSupportedFile, isMp4 } from './inspectors.js';

(() => {
  const headerControlsHost = document.getElementById('header-controls');
  const { clearBtn } = mountToolHeader({
    title: '文件元信息',
    controls: Array.from(headerControlsHost.children),
    clearButton: { onClear: () => clearAll() },
  });
  headerControlsHost.remove();

  const dropHint = document.getElementById('drop-hint');
  const dropStatus = document.getElementById('meta-drop-status');
  const fileInput = document.getElementById('file-input');
  const addBtn = document.getElementById('add-btn');
  const metaList = document.getElementById('meta-list');

  let cardCount = 0;
  /** @type {string[]} */
  const objectUrls = [];

  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  const lightboxCaption = document.getElementById('lightbox-caption');
  function openLightbox(url, caption) {
    lightboxImg.src = url;
    lightboxImg.alt = caption || '';
    lightboxCaption.textContent = caption || '';
    lightbox.classList.add('active');
  }
  function closeLightbox() {
    lightbox.classList.remove('active');
    lightboxImg.removeAttribute('src');
  }
  lightbox.addEventListener('click', closeLightbox);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && lightbox.classList.contains('active')) closeLightbox();
  });

  const fileDropZone = bindFileInputDropZone({
    zone: dropHint,
    input: fileInput,
    triggerElement: dropHint,
    triggerButton: addBtn,
    status: dropStatus,
    subject: '文件',
    async onFiles(files) {
      const supported = files.filter(isSupportedFile);
      const skipped = files.length - supported.length;
      if (!supported.length) {
        if (cardCount === 0) fileDropZone.setHasItems(false);
        setDropStatus('暂时只能识别 PNG、JPEG 和 MP4 文件，未在选择中找到可识别文件。', true);
        return;
      }
      setDropStatus(skipped > 0 ? `已跳过 ${skipped} 个非 PNG/JPEG/MP4 文件。` : '', false);
      supported.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
      for (const file of supported) {
        await addFileCard(file);
      }
    },
  });

  function setDropStatus(message, isError) {
    dropHint.classList.toggle('has-error', Boolean(isError));
    dropStatus.textContent = message || '';
    dropStatus.hidden = !message;
  }

  function clearAll() {
    metaList.innerHTML = '';
    metaList.classList.remove('active');
    cardCount = 0;
    objectUrls.splice(0).forEach((u) => URL.revokeObjectURL(u));
    closeLightbox();
    fileDropZone.clear();
    clearBtn.setCount(0);
  }

  async function addFileCard(file) {
    cardCount += 1;
    const url = URL.createObjectURL(file);
    objectUrls.push(url);

    const card = document.createElement('article');
    card.className = 'meta-card';
    const head = el('header', { class: 'meta-card-head' },
      el('span', { class: 'index', text: `#${cardCount}` }),
      el('span', { class: 'name', text: file.name }),
    );
    card.appendChild(head);

    const preview = el('div', { class: 'preview' });
    if (isMp4(file)) {
      const previewVideo = document.createElement('video');
      previewVideo.src = url;
      previewVideo.controls = true;
      previewVideo.preload = 'metadata';
      previewVideo.muted = true;
      previewVideo.playsInline = true;
      preview.appendChild(previewVideo);
    } else {
      const previewImg = document.createElement('img');
      previewImg.alt = `${file.name} 预览`;
      previewImg.title = '点击查看大图';
      previewImg.loading = 'lazy';
      previewImg.src = url;
      previewImg.addEventListener('click', () => openLightbox(url, file.name));
      preview.appendChild(previewImg);
    }
    card.appendChild(preview);

    const body = el('div', { class: 'meta-card-body' });
    card.appendChild(body);
    metaList.appendChild(card);
    metaList.classList.add('active');
    clearBtn.setCount(cardCount);
    try {
      await inspectFile(file, body);
    } catch (err) {
      console.error(err);
      card.classList.add('has-error');
      body.innerHTML = '';
      body.appendChild(el('div', { class: 'error-text', text: `解析失败：${err.message || err}` }));
    }
  }
})();
</script>
</body>
</html>
